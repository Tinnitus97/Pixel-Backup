name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            rid: win-x64
          - os: ubuntu-latest
            name: Linux
            rid: linux-x64

    steps:
      - uses: actions/checkout@v7

      - name: .NET einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Paketwerkzeuge für Linux einrichten
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # rpm: .rpm, squashfs-tools: AppImage, flatpak-builder: Flatpak-Bündel
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools flatpak flatpak-builder appstream
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Abhängigkeiten holen
        run: dotnet restore

      - name: Bauen
        run: dotnet build -c Release --no-restore

      - name: Testen
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Eigenständige Fassung erzeugen
        run: >
          dotnet publish src/PixelBackup.App -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -o publish/${{ matrix.rid }}

      - name: Start unter X11 prüfen
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          # Startet die fertige Datei in einer X11-Sitzung und wartet auf das Fenster.
          xvfb-run -a --server-args="-screen 0 1280x900x24" bash -c '
            publish/linux-x64/PixelBackup &
            app=$!
            for _ in $(seq 1 40); do
              xwininfo -root -children 2>/dev/null | grep -q "Pixel Backup" && break
              sleep 1
            done
            xwininfo -root -children | grep "Pixel Backup"
            kill $app'

      - name: AppStream-Angaben prüfen
        if: matrix.os == 'ubuntu-latest'
        # Dieselbe Prüfung, die flatpak-builder am Ende macht – nur in Sekunden.
        run: ./packaging/flatpak/check-metainfo.sh

      - name: Linux-Pakete bauen (tar.gz, deb, rpm, AppImage, Flatpak)
        if: matrix.os == 'ubuntu-latest'
        run: ./packaging/linux/package.sh --require-all

      # Nur vom Standardzweig wird etwas abgelegt.
      #
      # Der Grund ist das eingeschlossene Actions-Kontingent von 0,5 GB. Dieser
      # Workflow laeuft bei jedem Push auf JEDEN Zweig, und ein vollstaendiger
      # Durchlauf legte bisher rund 300 MiB ab - nach wenigen Zweigen war der
      # Speicher voll, und zwar kontoweit: Zuerst scheiterte der Upload in
      # einem ganz anderen Projekt.
      #
      # Gebaut und geprueft wird weiterhin auf jedem Zweig, samt Linux-Paketen
      # und X11-Start. Es wandert nur nichts mehr in den Speicher, was ohnehin
      # niemand herunterlaedt.
      - name: Ergebnis ablegen
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: pixel-backup-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 3

      # Die fuenf Linux-Pakete werden NICHT mehr abgelegt - sie waren mit rund
      # 165 MiB je Durchlauf der groesste Posten. Gebaut werden sie im Schritt
      # darueber weiterhin, und zwar mit --require-all: Faellt eines der
      # Formate aus, scheitert der Lauf genau wie vorher. Geprueft ist damit
      # unveraendert alles; abzuholen gibt es sie bei der Veroeffentlichung,
      # wo release.yml sie ohnehin neu baut und an das Release haengt.
